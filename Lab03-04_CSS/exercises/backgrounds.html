<!DOCTYPE html>
<html>
<head>

<title>Background Styling</title>

<style>

.bg1{
background:lightblue;
height:200px;
}

.bg2{
background-image:url("../images/backgrounds/bg.jpg");
background-size:cover;
height:200px;
}

.bg3{
background:linear-gradient(red,yellow);
height:200px;
}

.bg4{
background:radial-gradient(circle,blue,white);
height:200px;
}

</style>

</head>

<body>

<div class="bg1">Solid Color</div>

<div class="bg2">Image Background</div>

<div class="bg3">Linear Gradient</div>

<div class="bg4">Radial Gradient</div>

</body>
</html>
