<!DOCTYPE html>
<html>
<head>
<title>Float Layout</title>
<link rel="stylesheet" href="../styles/float.css">
</head>

<body>

<header>
    <h1>Float Layout Demo</h1>
</header>

<!-- Image + Text Wrap -->
<section class="container clearfix">
    
    <img src="../images/1.jfif" class="float-img" alt="Sample Image">

    <p>
        This text wraps around the floating image demonstrating how the float property works in CSS. 
        It allows content to flow naturally around elements like images, creating magazine-style layouts.
    </p>

</section>

<!-- 3 Column Layout -->
<section class="container clearfix">

    <div class="column">Column 1</div>
    <div class="column">Column 2</div>
    <div class="column">Column 3</div>

</section>

</body>
</html>
